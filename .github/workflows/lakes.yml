# One-off (manual): build lakes.js from OpenStreetMap and commit it to main
name: lakes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  lakes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_lakes.py lakes.js
      - run: |
          git config user.name "ifr-bot"; git config user.email "actions@users.noreply.github.com"
          git add lakes.js lakes_debug.txt && git commit -m "lakes.js (OSM)" && git push
